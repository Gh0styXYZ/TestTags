<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in | LBS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="brand">LBS</div>
            <nav class="nav" aria-label="Huvudnavigation">
                <a href="index.html">Startsida</a>
                <a href="form.html">Elevformulär</a>
                <a href="login.html" class="active">Logga in</a>
                <a href="register.html">Registrera</a>
            </nav>
        </header>

        <main class="page auth-page">
            <section class="form-card">
                <h1>Logga in</h1>
                <form>
                    <div class="form-group">
                        <label for="login-namn">Elevens namn/användarnamn</label>
                        <input type="text" id="login-namn" name="login-namn" placeholder="Skriv ditt namn eller användarnamn">
                    </div>

                    <div class="form-group">
                        <label for="login-losenord">Lösenord</label>
                        <input type="password" id="login-losenord" name="login-losenord" placeholder="Skriv ditt lösenord">
                    </div>

                    <div class="button-row">
                        <input type="submit" value="Logga in" class="btn btn-primary">
                        <input type="reset" value="Återställ" class="btn btn-secondary">
                    </div>
                </form>

                <p class="auth-link">
                    Har du inget konto? <a href="register.html">Gå till registrering</a>
                </p>
            </section>
        </main>

        <footer class="site-footer">
            <p>© 2026 LBS</p>
        </footer>
    </div>
</body>
</html>
