<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Studentformulär</title>
</head>
<body>

    <h1>Studentformulär</h1>

    <form>

        <label for="namn">Namn:</label>
        <input type="text" id="namn" name="namn">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="favoritämne">Favoritämne:</label>
        <select id="favoritämne" name="favoritämne">
            <option value="programmering">Programmering</option>
            <option value="matematik">Matematik</option>
            <option value="svenska">Svenska</option>
            <option value="engelska">Engelska</option>
            <option value="fysik">Fysik</option>
        </select>

        <br><br>

        <p>Vilka hobbyer har du?</p>

        <input type="checkbox" id="gaming" name="hobby" value="gaming">
        <label for="gaming">Gaming</label>

        <br>

        <input type="checkbox" id="musik" name="hobby" value="musik">
        <label for="musik">Musik</label>

        <br><br>
        
        <input type="submit" value="Skicka">
        <input type="reset" value="Rensa">

    </form>

    <br>

    <a href="index.html">Tillbaka till startsidan</a>

</body>
</html>
