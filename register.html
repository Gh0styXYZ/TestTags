<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrera | LBS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="brand">LBS</div>
            <nav class="nav" aria-label="Huvudnavigation">
                <a href="index.html">Startsida</a>
                <a href="form.html">Elevformulär</a>
                <a href="login.html">Logga in</a>
                <a href="register.html" class="active">Registrera</a>
            </nav>
        </header>

        <main class="page auth-page">
            <section class="form-card">
                <h1>Registrera dig</h1>
                <form>
                    <div class="form-group">
                        <label for="register-namn">Elevens namn/användarnamn</label>
                        <input type="text" id="register-namn" name="register-namn" placeholder="Skriv ditt namn eller användarnamn">
                    </div>

                    <div class="form-group">
                        <label for="register-email">E-postadress</label>
                        <input type="email" id="register-email" name="register-email" placeholder="namn@exempel.se">
                    </div>

                    <div class="form-group">
                        <label for="register-losenord">Lösenord</label>
                        <input type="password" id="register-losenord" name="register-losenord" placeholder="Skapa ett lösenord">
                    </div>

                    <div class="form-group">
                        <label for="register-bekrafta">Bekräfta lösenord</label>
                        <input type="password" id="register-bekrafta" name="register-bekrafta" placeholder="Skriv lösenordet igen">
                    </div>

                    <div class="button-row">
                        <input type="submit" value="Registrera" class="btn btn-primary">
                        <input type="reset" value="Återställ" class="btn btn-secondary">
                    </div>
                </form>

                <p class="auth-link">
                    Redan medlem? <a href="login.html">Gå till inloggning</a>
                </p>
            </section>
        </main>

        <footer class="site-footer">
            <p>© 2026 LBS</p>
        </footer>
    </div>
</body>
</html>
